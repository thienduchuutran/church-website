services:
  db:
    image: postgres:16-alpine
    container_name: church-db-local
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: church_dev
    volumes:
      - church_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d church_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  church_db_data:
